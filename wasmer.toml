[package]
name = "iconandy697/hermes001"
version = "0.1.0"
description = "Hermes Agent Template"

[[app.storage]]
# 这允许你的应用在重启后依然记住配置
volume = "hermes-data"
mount = "/data"

[http.server]
kind = "host"

[[commands]]
name = "web"
source = "python"
# 关键：这里明确指定运行 server.py 里的 app 对象
args = ["-m", "uvicorn", "server:app", "--host", "0.0.0.0", "--port", "$PORT"]

[dependencies]
"python" = "3.12"
